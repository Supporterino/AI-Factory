name: E2E

on:
  workflow_dispatch:

permissions: {}

jobs:
  opencode-runtime:
    name: opencode runtime (${{ matrix.opencode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        opencode: ["2.1.2", "2.2.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install opencode ${{ matrix.opencode }}
        run: npm install --global @opencode/cli@${{ matrix.opencode }}
      - run: opencode --version
      - name: Run the real-runtime test with the stub model
        env:
          AI_FACTORY_E2E: "1"
        run: bun test test/opencode-runtime.e2e.test.ts --timeout 120000
